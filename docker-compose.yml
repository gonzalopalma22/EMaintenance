include:
  - path: infra/rabbitmq/docker-compose.yml
    env_file: .env
  - path: infra/kafka/docker-compose.yml
    env_file: .env
  - path: infra/kafka-ui/docker-compose.yml
    env_file: .env

x-app: &app
  networks: [emaintenance-net]
  restart: unless-stopped

x-spring: &spring-comun
  SERVER_ADDRESS: 0.0.0.0
  AZURE_TENANT_ID: ${AZURE_TENANT_ID}
  AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID}
  RABBIT_HOST: rabbitmq
  RABBIT_USER: ${RABBIT_USER}
  RABBIT_PASS: ${RABBIT_PASS}

x-db: &db
  DB_HOST: postgres
  DB_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

x-kafka: &kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092

services:
  postgres:
    <<: *app
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  admin-rabbitmq:
    <<: *app
    build: ./services/admin-rabbitmq
    environment:
      <<: *spring-comun
      RABBIT_MGMT_URL: http://rabbitmq:15672
    depends_on:
      rabbit-init:
        condition: service_completed_successfully

  telemetria:
    <<: *app
    build: ./services/telemetria
    environment:
      <<: [*spring-comun, *db, *kafka]
    depends_on:
      rabbit-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  alertas:
    <<: *app
    build: ./services/alertas
    environment:
      <<: [*spring-comun, *db]
    depends_on:
      rabbit-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  ordenes-trabajo:
    <<: *app
    build: ./services/ordenes-trabajo
    environment:
      <<: [*spring-comun, *db]
      AZURE_API_CLIENT_SECRET: ${AZURE_API_CLIENT_SECRET}
    depends_on:
      rabbit-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  simulador-sensores:
    <<: *app
    build: ./services/simulador-sensores
    environment:
      <<: *spring-comun
    depends_on:
      rabbit-init:
        condition: service_completed_successfully

  prediccion-ml:
    <<: *app
    build: ./services/prediccion-ml
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID}
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASS: ${RABBIT_PASS}
    depends_on:
      rabbit-init:
        condition: service_completed_successfully

  admin-kafka:
    <<: *app
    build: ./services/admin-kafka
    environment:
      <<: [*spring-comun, *kafka]
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  analitica:
    <<: *app
    build: ./services/analitica
    environment:
      <<: [*spring-comun, *kafka]
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  api-gateway:
    <<: *app
    build: ./services/api-gateway
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID}
      CORS_ORIGIN: ${CORS_ORIGIN}
      ADMIN_RABBITMQ_URL: http://admin-rabbitmq:8081
      TELEMETRIA_URL: http://telemetria:8082
      ALERTAS_URL: http://alertas:8083
      ORDENES_URL: http://ordenes-trabajo:8084
      SIMULADOR_URL: http://simulador-sensores:8085
      PREDICCION_URL: http://prediccion-ml:8086
      ADMIN_KAFKA_URL: http://admin-kafka:8087
      ANALITICA_URL: http://analitica:8088
    ports:
      - "8080:8080"
    depends_on:
      - admin-rabbitmq
      - telemetria
      - alertas
      - ordenes-trabajo
      - simulador-sensores
      - prediccion-ml
      - admin-kafka
      - analitica

volumes:
  pg_data:

networks:
  emaintenance-net:
    external: true
    name: emaintenance-net