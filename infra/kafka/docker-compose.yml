name: emaintenance-kafka

# Variables comunes de los tres brokers.
x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

# Variables comunes de los tres nodos Zookeeper; cada nodo agrega su ZOOKEEPER_SERVER_ID.
# Los límites de sincronización están holgados porque el equipo corre muchos contenedores a la vez.
x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 10
  ZOOKEEPER_SYNC_LIMIT: 5
  ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
  KAFKA_HEAP_OPTS: "-Xms64m -Xmx128m"

services:
  # Ensamble de 3 nodos Zookeeper: el quórum es de 2, así que el clúster tolera la caída de uno.
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper-1
    hostname: zookeeper-1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zk1_data:/var/lib/zookeeper/data
      - zk1_log:/var/lib/zookeeper/log
    networks: [emaintenance-net]
    restart: unless-stopped

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper-2
    hostname: zookeeper-2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zk2_data:/var/lib/zookeeper/data
      - zk2_log:/var/lib/zookeeper/log
    networks: [emaintenance-net]
    restart: unless-stopped

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper-3
    hostname: zookeeper-3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zk3_data:/var/lib/zookeeper/data
      - zk3_log:/var/lib/zookeeper/log
    networks: [emaintenance-net]
    restart: unless-stopped

  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-1
    depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [emaintenance-net]
    restart: unless-stopped

  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-2
    depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - kafka2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [emaintenance-net]
    restart: unless-stopped

  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-3
    depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9094
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafka3_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [emaintenance-net]
    restart: unless-stopped

  # Crea los tópicos base y les aplica sus parámetros de administración.
  # Es repetible: si el tópico ya existe, solo actualiza su configuración.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e

        # crear <tópico> <retención en ms> <política de limpieza>
        crear() {
          kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists \
            --topic "$$1" --partitions 3 --replication-factor 3
          kafka-configs --bootstrap-server kafka-1:29092 --alter \
            --entity-type topics --entity-name "$$1" \
            --add-config "retention.ms=$$2,cleanup.policy=$$3,min.insync.replicas=2,max.message.bytes=1048576"
        }

        # Lecturas de sensores: se conservan 7 días para poder releerlas y recalcular
        crear telemetria.lecturas 604800000 delete
        # Resúmenes: se publica uno cada 30 s y solo importa lo reciente (1 día)
        crear analitica.resumen 86400000 delete
        # Predicciones: seguimiento de corto plazo (3 días)
        crear analitica.predicciones 259200000 delete
        # Mensajes fallidos: 14 días para dar tiempo a revisarlos
        crear telemetria.lecturas.DLT 1209600000 delete
        crear analitica.resumen.DLT 1209600000 delete
        crear analitica.predicciones.DLT 1209600000 delete

        kafka-topics --bootstrap-server kafka-1:29092 --list
    networks: [emaintenance-net]
    restart: "no"

networks:
  emaintenance-net:
    external: true
    name: emaintenance-net

volumes:
  zk1_data:
  zk1_log:
  zk2_data:
  zk2_log:
  zk3_data:
  zk3_log:
  kafka1_data:
  kafka2_data:
  kafka3_data: