server:
  port: 8083
  address: 127.0.0.1

spring:
  application:
    name: alertas
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
          audiences: ${AZURE_API_CLIENT_ID}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASS}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    consumer:
      client-id: alertas-consumer
      # Grupo propio: alertas y analitica leen tópicos distintos y no se reparten mensajes entre sí
      group-id: alertas-resumen
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
    listener:
      # Un hilo consumidor por partición del tópico (3)
      concurrency: 3
      ack-mode: record
    producer:
      # Solo lo usa la DLT para reenviar el mensaje fallido tal como llegó
      client-id: alertas-producer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

kafka:
  topic-resumen: analitica.resumen

alertas:
  enfriamiento: 10m
  reglas:
    temperatura:
      umbral: 100.0
      critico: 150.0
    vibracion:
      umbral: 7.0
      critico: 11.0
    presion:
      umbral: 8.0
      critico: 10.0