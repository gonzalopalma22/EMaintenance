server.port=8080

logging.level.org.springframework.cloud.gateway=INFO

# CORS (solo aquí, en el gateway)
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

# Evita cabeceras CORS duplicadas si el servicio también las envía
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# admin-rabbitmq (8081)
spring.cloud.gateway.server.webflux.routes[0].id=admin-rabbitmq
spring.cloud.gateway.server.webflux.routes[0].uri=http://127.0.0.1:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/bindings/**,/api/queues/**,/api/exchanges/**,/api/dlq/**

# telemetria (8082)
spring.cloud.gateway.server.webflux.routes[1].id=telemetria
spring.cloud.gateway.server.webflux.routes[1].uri=http://127.0.0.1:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/lecturas/**

# alertas (8083)
spring.cloud.gateway.server.webflux.routes[2].id=alertas
spring.cloud.gateway.server.webflux.routes[2].uri=http://127.0.0.1:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/alertas/**

# ordenes-trabajo (8084)
spring.cloud.gateway.server.webflux.routes[3].id=ordenes-trabajo
spring.cloud.gateway.server.webflux.routes[3].uri=http://127.0.0.1:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/ordenes/**

# simulador-sensores (8085)
spring.cloud.gateway.server.webflux.routes[4].id=simulador-sensores
spring.cloud.gateway.server.webflux.routes[4].uri=http://127.0.0.1:8085
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/simulador/**

# prediccion-ml (8086)
spring.cloud.gateway.server.webflux.routes[5].id=prediccion-ml
spring.cloud.gateway.server.webflux.routes[5].uri=http://127.0.0.1:8086
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/predicciones/**