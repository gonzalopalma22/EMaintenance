server:
  port: 8081
  address: 127.0.0.1

spring:
  application:
    name: admin-rabbitmq
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASS}

rabbitmq-management:
  url: ${RABBIT_MGMT_URL:http://localhost:15672}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never