server:
  port: 8088
  address: 127.0.0.1

spring:
  application:
    name: analitica
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
          audiences: ${AZURE_API_CLIENT_ID}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    consumer:
      client-id: analitica-consumer
      group-id: analitica
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
      properties:
        # Al sumarse o salir un consumidor, solo se mueven las particiones necesarias
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
    listener:
      # Un hilo consumidor por partición del tópico (3): el grupo reparte la carga
      concurrency: 3
      # Confirma el offset después de procesar cada registro
      ack-mode: record
    producer:
      client-id: analitica-producer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 20
        compression.type: gzip

analitica:
  topic-lecturas: telemetria.lecturas
  topic-resumen: analitica.resumen
  ventana-segundos: 300
  intervalo-resumen-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never