server:
  port: 8082
  address: 127.0.0.1

spring:
  application:
    name: telemetria
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
          audiences: ${AZURE_API_CLIENT_ID}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASS}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    producer:
      client-id: telemetria-producer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.mantenimiento.telemetria.messaging.LecturaEventSerializer
      acks: all
      properties:
        # Sin duplicados ni reordenamientos aunque haya reintentos
        enable.idempotence: true
        # Agrupa mensajes unos milisegundos y los comprime para ahorrar red
        linger.ms: 20
        compression.type: gzip
        # Si Kafka no responde, falla rápido y no bloquea el consumo de RabbitMQ
        max.block.ms: 3000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

telemetria:
  kafka:
    topic-lecturas: telemetria.lecturas

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never